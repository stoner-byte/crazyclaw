[package]
name = "crazyclaw_desktop"
version = "0.0.1"
description = "CrazyClaw desktop shell"
authors = ["CrazyClaw"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crazyclaw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2.8.0"
tauri-plugin-shell = "2.3.5"
